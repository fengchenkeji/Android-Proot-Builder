name: Build-Proot-Android
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --progress=plain \
            -t proot-builder \
            -f Dockerfile .

      - name: Build PRoot (all architectures)
        run: |
          failed=0
          for arch in aarch64 armv7a x86_64; do
            echo "========================================"
            echo "Building architecture: $arch"
            echo "========================================"
            mkdir -p output/$arch
            logfile="build-$arch.log"
            docker run --rm \
              -v "$(pwd)/output/$arch:/output" \
              -e TARGET_ARCH=$arch \
              -e TALLOC_LINK=static \
              proot-builder 2>&1 | tee "$logfile"
            exit_code=${PIPESTATUS[0]}
            if [ $exit_code -ne 0 ]; then
              echo "::error::Build failed for $arch (exit code: $exit_code)"
              echo "=== Last 100 lines of build log ==="
              tail -100 "$logfile"
              # 将关键错误行输出到 annotations（匿名可见）
              echo "=== Key errors (annotations) ==="
              grep -iE 'error:|undefined reference|fatal|cannot find|No such file|relocation|ld\.lld|clang.*error' "$logfile" | tail -20 | while IFS= read -r line; do
                echo "::error::[$arch] $line"
              done
              failed=1
            else
              echo "=== $arch output files ==="
              ls -la output/$arch/
            fi
          done
          if [ $failed -ne 0 ]; then
            echo "::error::One or more architectures failed to build"
            exit 1
          fi

      - name: Verify artifacts (file type check)
        if: always()
        run: |
          echo "=== ELF file verification ==="
          for f in output/*/libproot.so; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              file "$f"
              if file "$f" | grep -q "shared object"; then
                echo "[OK] is a shared object"
              else
                echo "::error::NOT a shared object: $f"
              fi
            else
              echo "::warning::Missing: $f"
            fi
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proot-android
          path: output/**
