name: Build-Proot-Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            abi: arm64-v8a
            triple: aarch64-linux-android
            qemu: qemu-aarch64-static
            expect_machine: AArch64
          - arch: armv7a
            abi: armeabi-v7a
            triple: armv7a-linux-androideabi
            qemu: qemu-arm-static
            expect_machine: ARM

    steps:
      - name: Checkout main (workflow)
        uses: actions/checkout@v4

      - name: Checkout proot source branch
        uses: actions/checkout@v4
        with:
          ref: proot
          path: proot-branch

      - name: Set up source directory
        run: |
          cp -r proot-branch/proot-src ./proot-src
          ls -la proot-src/src/CMakeLists.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            qemu-user-static gawk zip file

      - name: Find Android NDK
        id: ndk
        run: |
          NDK_DIR=""
          for candidate in \
            "/usr/local/lib/android/sdk/ndk"/* \
            "${ANDROID_NDK_HOME:-}" \
            "${ANDROID_NDK_LATEST_HOME:-}"; do
            if [ -d "$candidate/toolchains/llvm/prebuilt" ]; then
              NDK_DIR="$candidate"
              break
            fi
          done
          if [ -z "$NDK_DIR" ]; then
            echo "::error::Android NDK not found on runner"
            exit 1
          fi
          echo "ndk_dir=$NDK_DIR" >> "$GITHUB_OUTPUT"
          echo "NDK found at: $NDK_DIR"
          ls "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep -E 'clang$' | head -5

      - name: Build libproot.so with CMake
        env:
          NDK: ${{ steps.ndk.outputs.ndk_dir }}
          ABI: ${{ matrix.abi }}
          ARCH: ${{ matrix.arch }}
        run: |
          API=28
          TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "=== NDK bin contents (clang) ==="
          ls "$BIN" | grep -E 'clang$|clang[0-9]' | head -10

          mkdir -p build
          cd build

          echo "=== CMake configure ==="
          if ! cmake ../proot-src/src \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM="android-$API" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPROOT_BUILD_TEST_EXECUTABLE=OFF; then
            echo "::error::CMake configure failed"
            exit 1
          fi

          echo "=== Ninja build ==="
          ninja -v -j"$(nproc)" 2>&1 | tee ninja.log
          ninja_ret=${PIPESTATUS[0]}
          if [ "$ninja_ret" -ne 0 ]; then
            echo "::error::Ninja build failed (exit $ninja_ret)"
            echo "=== Last 30 lines ==="
            tail -30 ninja.log
            echo "=== Error lines ==="
            grep -iE 'error:|undefined reference|fatal|cannot find|No such file' ninja.log | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

          echo "=== Build output ==="
          find . -name 'libproot.so' -exec ls -la {} \;

      - name: Static verification
        env:
          ARCH: ${{ matrix.arch }}
          EXPECT_MACHINE: ${{ matrix.expect_machine }}
        run: |
          set -e
          SO=$(find build -name 'libproot.so' | head -1)
          echo "=== file ==="
          file "$SO"

          echo "=== readelf -h ==="
          readelf -h "$SO" | grep -E 'Type|Machine'

          readelf -h "$SO" | grep -q 'DYN (Shared object file)' \
            || { echo "::error::Not a shared object"; exit 1; }

          readelf -h "$SO" | grep -q "$EXPECT_MACHINE" \
            || { echo "::error::Wrong architecture, expected $EXPECT_MACHINE"; exit 1; }

          echo "=== main symbol ==="
          readelf -s "$SO" | grep -w main | grep -q 'GLOBAL DEFAULT' \
            || { echo "::error::main not GLOBAL DEFAULT"; exit 1; }
          readelf -s "$SO" | grep -w main

          echo "=== loader embedded symbols ==="
          nm "$SO" | grep _binary_loader | head -10

          echo "::notice::$ARCH static verification passed"

      - name: Cross-compile dlopen test
        env:
          NDK: ${{ steps.ndk.outputs.ndk_dir }}
          TRIPLE: ${{ matrix.triple }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          API=28
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${TRIPLE}${API}-clang"

          cat > /tmp/test_dlopen.c << 'CEOF'
          #include <stdio.h>
          #include <dlfcn.h>
          typedef int (*main_fn)(int argc, char *argv[]);
          int main(void) {
              void *h = dlopen("./libproot.so", RTLD_NOW | RTLD_GLOBAL);
              if (!h) { fprintf(stderr, "dlopen failed: %s\n", dlerror()); return 1; }
              printf("[OK] dlopen\n");
              main_fn fn = (main_fn)dlsym(h, "main");
              if (!fn) { fprintf(stderr, "dlsym main failed: %s\n", dlerror()); return 1; }
              printf("[OK] dlsym(main)\n");
              char *args[] = {"proot", "--version"};
              int ret = fn(2, args);
              printf("proot returned %d\n", ret);
              dlclose(h);
              return 0;
          }
          CEOF

          SO=$(find build -name 'libproot.so' | head -1)
          mkdir -p output/$ARCH
          cp "$SO" output/$ARCH/libproot.so

          "$CC" -o output/$ARCH/test_dlopen /tmp/test_dlopen.c -ldl
          file output/$ARCH/test_dlopen

      - name: Run dlopen test under qemu-user
        env:
          QEMU: ${{ matrix.qemu }}
          ARCH: ${{ matrix.arch }}
          NDK: ${{ steps.ndk.outputs.ndk_dir }}
        run: |
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cd output/$ARCH

          echo "=== file test_dlopen ==="
          file ./test_dlopen
          echo "=== file libproot.so ==="
          file ./libproot.so
          echo "=== readelf -d test_dlopen ==="
          readelf -d ./test_dlopen | head -10

          echo "=== Running $QEMU ==="
          "$QEMU" -L "$SYSROOT" -E LD_LIBRARY_PATH=/lib ./test_dlopen 2>&1 | tee test_output.log
          ret=${PIPESTATUS[0]}
          echo "qemu exit code: $ret"

          if grep -q "v5.1.107.92" test_output.log; then
            echo "::notice::$ARCH qemu dlopen test passed"
          else
            echo "::warning::Version string not found in qemu output (may be environment limitation)"
            echo "=== Full output ==="
            cat test_output.log
          fi

      - name: Upload per-arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: proot-${{ matrix.arch }}
          path: output/${{ matrix.arch }}/libproot.so
          retention-days: 30

  release:
    name: Package and release
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release zip
        run: |
          mkdir -p package/aarch64 package/armv7a
          cp artifacts/proot-aarch64/libproot.so package/aarch64/libproot.so
          cp artifacts/proot-armv7a/libproot.so package/armv7a/libproot.so
          cd package
          zip -r ../proot-android.zip aarch64 armv7a
          cd ..
          ls -la proot-android.zip
          unzip -l proot-android.zip

      - name: Upload to GitHub Release (proot-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: proot-latest
          name: "PRoot Android Builds (latest)"
          body: |
            Auto-generated proot builds for Android.
            Built with CMake + Android NDK on Linux (no Docker).
            talloc statically linked, loader embedded.
            Contains:
            - aarch64/libproot.so (arm64-v8a, API 28)
            - armv7a/libproot.so (armeabi-v7a, API 28)
          files: proot-android.zip
          fail_on_unmatched_files: true
          make_latest: true
