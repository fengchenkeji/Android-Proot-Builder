name: Build-Proot-Android
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --progress=plain \
            -t proot-builder \
            -f Dockerfile .

      - name: Build PRoot (all architectures)
        run: |
          for arch in aarch64 armv7a x86_64; do
            echo "========================================"
            echo "Building architecture: $arch"
            echo "========================================"
            mkdir -p output/$arch
            docker run --rm \
              -v "$(pwd)/output/$arch:/output" \
              -e TARGET_ARCH=$arch \
              -e TALLOC_LINK=static \
              proot-builder
          done

      - name: Verify artifacts (file type check)
        run: |
          echo "=== ELF file verification ==="
          for f in output/*/libproot.so; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              file "$f"
              if file "$f" | grep -q "shared object"; then
                echo "[OK] is a shared object"
              else
                echo "[FAIL] NOT a shared object"
                exit 1
              fi
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proot-android
          path: output/**
